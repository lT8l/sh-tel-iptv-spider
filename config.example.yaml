stb:
  uid: 'xxxxxxxxx@etv1'
  mac: 'xx:xx:xx:xx:xx:xx'
  sn: '000xxxxxxxxxxxxxxx'
  type: 'B860A'
  interface: 'eth1' # 连接 IPTV 专网的出口网卡
  auth_host: '222.68.208.73:7001'

epg:
  generator: 'sh-tel-iptv-spider'
  source: 'Telecom Shanghai IPTV'
  history_days: 1
  future_days: 3
  timezone: 'Asia/Shanghai'

# 频道栏目。每组都会以 cateID/type 请求 getChannelList，汇总后统一做清晰度去重。
categories:
  - cateID: '000406'
    type: ''

output:
  xml: 'channels.xml'
  m3u8: 'channels.m3u8'
  stream_mode: 'rtp' # udp / rtp / raw
  # 把 ChannelFCCIP/ChannelFCCPort 写成 ?fcc=IP:port。
  fcc: true
  # 0 表示不写 catchup；基于 TimeShiftURL 追加 playseek。
  catchup_days: 7
  catchup_template: 'playseek=${(b)yyyyMMddHHmmss}-${(e)yyyyMMddHHmmss}'
  include_shopping: false

request:
  timeout_seconds: 120
  interval_milliseconds: 500 # 0 表示连续请求之间不额外等待
